name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip yuk_belajar_ipa_hp_ready.zip -d extracted
          cp -a extracted/yuk_belajar_ipa/. .
          rm -rf extracted
          rm yuk_belajar_ipa_hp_ready.zip

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Yuk Belajar IPA project"
          git push
